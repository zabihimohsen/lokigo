name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v0.2.0)"
        required: true
        type: string
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...

  create_tag:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag format
        run: |
          TAG="${{ inputs.tag }}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must follow semver format, e.g. v0.2.0 or v0.2.0-rc.1"
            exit 1
          fi

      - name: Ensure tag does not already exist
        run: |
          TAG="${{ inputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
            exit 1
          fi

      - name: Create and push tag
        run: |
          TAG="${{ inputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

  publish_release:
    # Publishes on both paths:
    #   - workflow_dispatch: after create_tag pushes the tag (a tag pushed by
    #     GITHUB_TOKEN does NOT re-trigger the `push: tags` event, so we cannot
    #     rely on that here — we publish directly using inputs.tag).
    #   - push of a v* tag from a local machine: action infers the tag from the ref.
    needs: [test, create_tag]
    if: >
      always() && needs.test.result == 'success' &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && needs.create_tag.result == 'success')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Set on dispatch; empty on a tag push, where the action infers it from the ref.
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
